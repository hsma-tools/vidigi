name: tests
run-name: Run tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      os:
        description: 'OS to run on'
        type: choice
        default: 'all'
        options:
          - all
          - ubuntu-latest
          - windows-latest
          - macos-latest
      python:
        description: 'Python version to run'
        type: choice
        default: 'all'
        options:
          - all
          - '3.10'
          - '3.11'
          - '3.12'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full matrix on Ubuntu (fastest feedback)
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          # Latest Python on other OSes
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip non-selected combinations
        if: |
          github.event_name == 'workflow_dispatch' && (
            (github.event.inputs.os != 'all' && github.event.inputs.os != matrix.os) ||
            (github.event.inputs.python != 'all' && github.event.inputs.python != matrix.python-version)
          )
        run: exit 78  # GitHub Actions skip exit code

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r dev_environment/requirements.txt

      - name: Install package
        run: pip install -e .

      - name: Run tests
        run: pytest --verbose --tb=short
