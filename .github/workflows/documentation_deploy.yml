name: Documentation Deploy

on:
  push:
    branches: [main]
    paths:
      - dev_environment/**
      - pyproject.toml
      - vidigi/**
      - vidigi_docs/**
      - examples/**
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - LICENSE.md
      - HISTORY.md
      - theme-dark.scss
      - theme-light.scss
      - _extensions/**
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        run: |
          pip install -r dev_environment/requirements.txt
          pip install -e .

      - name: Build API docs with quartodoc
        run: quartodoc build

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
