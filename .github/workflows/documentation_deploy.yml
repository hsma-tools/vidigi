name: Documentation Deploy

on:
  push:
    branches: [main]
    paths:
      - dev_environment/**
      - pyproject.toml
      - src/vidigi/**
      - vidigi_docs/**
      - examples/**
      - assets/**
      - _quarto.yml
      - index.qmd
      - CONTRIBUTING.md
      - CODE_OF_CONDUCT.md
      - LICENSE.md
      - HISTORY.md
      - theme-dark.scss
      - theme-light.scss
      - _extensions/**
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Ignore the cached _freeze/ and re-execute every page"
        required: false
        default: false
        type: boolean

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        run: |
          pip install -r dev_environment/requirements.txt
          pip install -e .

      # Quarto's `freeze: auto` (see _quarto.yml) only re-executes a page whose
      # source changed. It doesn't track library dependencies or the Python
      # models and CSV data used by examples, so those also scope the cache:
      # changing any of them re-executes every page. Other unchanged pages can
      # reuse their outputs for text-only edits. The requirements are unpinned,
      # hence hashing the resolved environment rather than requirements.txt.
      - name: Hash installed environment
        id: env_hash
        run: echo "hash=$(pip freeze --exclude-editable | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore cached page executions
        if: ${{ !inputs.full_rebuild }}
        uses: actions/cache@v4
        with:
          path: _freeze
          key: docs-freeze-${{ steps.env_hash.outputs.hash }}-${{ hashFiles('src/vidigi/**', 'pyproject.toml', '_extensions/**', 'examples/**/*.py', 'examples/**/*.csv') }}-${{ github.sha }}
          restore-keys: |
            docs-freeze-${{ steps.env_hash.outputs.hash }}-${{ hashFiles('src/vidigi/**', 'pyproject.toml', '_extensions/**', 'examples/**/*.py', 'examples/**/*.csv') }}-

      - name: Build API docs with quartodoc
        run: quartodoc build

      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
