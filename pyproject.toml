[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vidigi"
version = "1.3.1"
description = "A package for creating animated visualisations of queues and pathways from historical data or simulations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Sammi Rosser", email = "s.j.rosser@exeter.ac.uk" },
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "plotly>=5.12.0,<7.0.0",
    "numpy>=1.26.2,<3.0.0",
    "pandas>=2.0.1,<3.0.0",
    "simpy>=4.0.0,<5.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "webcolors>=24.11.1",
    "graphviz>=0.15,<1.0.0",
    "ipywidgets>=8.0.0",
    "ipycytoscape>=1.2.0,<2.0.0",
    "packaging>=21.0"
]

[project.urls]
Homepage = "https://github.com/hsma-tools/vidigi"
Documentation = "http://hsma-tools.github.io/vidigi/vidigi_docs/"
"Bug Tracker" = "https://github.com/hsma-tools/vidigi/issues"

[tool.hatch.build.targets.sdist]
include = ["src/vidigi"]

[tool.hatch.build.targets.wheel]
packages = ["src/vidigi"]

[template.plugins.default]
src-layout = true


[project.optional-dependencies]
streamlit = [
  "streamlit-javascript==0.1.5",
  "st-cytoscape==0.0.5"
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
    "quick: quick core tests to determine main vidigi functions run with default params"
]
addopts = "-ra"


[dependency-groups]
dev = [
    "black",
    "ciw>=3.2.5,<4.0.0",
    "flake8",
    "greenlet>=3.3.2",
    "griffe>=0.49.0",
    "hatch",
    "jupyterlab>=4.2.4",
    "jupyterlab-spellchecker>=0.8.4",
    "lintquarto>=0.8.0,<1.0.0",
    "matplotlib>=3.9.2,<4.0.0",
    "mesa>=2.3.0,<3.0.0",
    "nbqa",
    "pillow>=10.0.0",
    "pylint>=4.0.5",
    "pytest>=8.3.2,<9.0.0",
    "pytest-html>=4.1.1",
    "quartodoc>=0.9.1",
    "salabim>=26.0.1",
    "sim-tools>=0.9.0,<1.0.0",
    "st-cytoscape>=0.0.5,<1.0.0",
    "streamlit>=1.52.2,<2.0.0",
    "tox>=4.25.0,<5.0.0",
]
