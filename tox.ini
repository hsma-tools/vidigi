[tox]
envlist =
    py{310,311,312,313,314}-plotly{5,6},
    min-versions,
    min-numpy-pandas-simpy,
    max-versions

[testenv]
deps =
    -r{toxinidir}/tests/requirements.txt
    plotly5: plotly>=5.12.0,<6
    # Newer sim-tools requires Plotly 6; only the sample models use it.
    plotly5: sim-tools==0.6.1
    plotly6: plotly>=6.0.0,<7
    plotly6: sim-tools>=0.9.0,<1.0.0
setenv =
    COVERAGE_FILE = {envtmpdir}/.coverage
commands =
    python -m pip check
    python -m pytest -n 2 --cov=vidigi --cov-branch --cov-report=term-missing {posargs}

# Old NumPy/pandas wheels require an older Python. The two simulation-model
# modules and one real-model regression require sim-tools, whose distribution
# API requires pandas >=2.
# All other tests run here; the full suite runs in both Plotly-major jobs.
[testenv:min-versions]
basepython = python3.10
deps =
    -r{toxinidir}/tests/requirements.txt
    numpy==1.24.0
    pandas==1.5.3
    simpy==4.0.0
    plotly==5.12.0
    scipy==1.10.0
    setuptools>=69,<81
commands =
    python -m pip check
    python -m pytest -n 2 --cov=vidigi --cov-branch --cov-report=term-missing --ignore=tests/test_against_core_simpy.py --ignore=tests/test_simple_funcs_run.py --deselect=tests/test_multi_run_guard.py::test_real_trial_output_is_rejected_unfiltered_and_accepted_filtered {posargs}

[testenv:min-numpy-pandas-simpy]
basepython = python3.10
deps =
    -r{toxinidir}/tests/requirements.txt
    numpy==1.24.0
    pandas==1.5.3
    simpy==4.0.0
    plotly>=5.12.0,<6
    scipy==1.10.0
    setuptools>=69,<81
commands = {[testenv:min-versions]commands}

[testenv:max-versions]
basepython = python3.14
deps =
    -r{toxinidir}/tests/requirements.txt
    pandas>=3.0,<4.0.0
    sim-tools>=0.9.0,<1.0.0
